version: '3.8'

services:
  bot:
    build: .
    container_name: findmyhome-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./google-credentials.json:/app/google-credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
